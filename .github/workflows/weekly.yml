name: weekly
on:
  schedule:
    # 每周一 UTC 10:17 = 北京时间周一 18:17，跑上一整周（周一到周日）的周榜。
    # 洛杉矶的周日在周一 UTC 08:00（夏令时 07:00）结束，此时上一周已收官；
    # DeepSeek 工作日高峰价到 UTC 10:00 为止，之后是平价；避开整点减少 GitHub 排队。
    - cron: "17 10 * * 1"
  workflow_dispatch:
    inputs:
      date:
        description: "补跑：填该周任意一天 YYYY-MM-DD（留空 = 上一周）"
        required: false
permissions:
  contents: write
concurrency: weekly
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Generate report
        env:
          PH_TOKEN: ${{ secrets.PH_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}   # 只用于查询仓库 star 数，自动提供，无需配置
          RUN_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$RUN_DATE" ]; then python main.py --week "$RUN_DATE"; else python main.py; fi
      - name: Commit report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data
          git diff --cached --quiet || git commit -m "report: $(date -u +%F)"
          git pull --rebase
          git push
